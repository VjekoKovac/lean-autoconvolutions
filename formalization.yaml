# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/v0.4.schema.json
version: "v0.4"

project:
  name: "Sharpness of the Martin–O'Bryant autoconvolution inequality"
  description: >-
    The autoconvolution inequality of Martin and O’Bryant has sharp constant equal to 1. 
    In other words, for every real ε > 0, there are finitely many nonnegative real 
    heights p₀,…,p_d, at least one positive, such that the autoconvolution of the step 
    function taking height pⱼ on [j,j+1) and zero elsewhere has the ratio 
    (L² norm)^2 / (L¹ norm) (L∞ norm) greater than 1−ε.
  authors: ["Tonći Crmarić", "Vjekoslav Kovač", "Jelena Rupčić"]
  responsible_maintainers: ["Vjekoslav Kovač"]
  license: "Apache-2.0"

classification:
  arxiv: ["math.CA"]
  msc2020: ["26D15", "42A85"]

sources:
  - title: "Sharpness of the Martin–O'Bryant autoconvolution inequality"
    authors: ["Tonći Crmarić", "Vjekoslav Kovač", "Jelena Rupčić"]
    id: "arXiv:2611.12685v1"
    location: "Theorem 1 and its proof in Section 2"
    type: "preprint"
    relationship: "formalizes"

